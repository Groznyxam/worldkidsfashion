<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register as Reseller — WorldKidsFashion™</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box" style="max-width:540px">
    <div class="auth-icon"></div>
    <h1 class="auth-title">Become a Reseller</h1>
    <p class="auth-sub">Join 20,000+ wholesale buyers worldwide. Free registration — instant access to all prices.</p>
    <form id="registerForm">
      <div class="fg-2">
        <div class="fg"><label>First Name</label><input type="text" placeholder="John" required></div>
        <div class="fg"><label>Last Name</label><input type="text" placeholder="Smith" required></div>
      </div>
      <div class="fg"><label>Business / Full Name</label><input type="text" id="regName" placeholder="Your name or company name" required></div>
      <div class="fg"><label>Business Email</label><input type="email" id="regEmail" placeholder="your@business.com" required></div>
      <div class="fg"><label>Phone / WhatsApp</label><input type="tel" placeholder="+1 234 567 8900"></div>
      <div class="fg"><label>Country</label>
        <select id="regCountry" required>
          <option value="">Select your country…</option>
          <option>United States</option><option>United Kingdom</option><option>Germany</option><option>France</option><option>Netherlands</option><option>Russia</option><option>Kazakhstan</option><option>UAE</option><option>Saudi Arabia</option><option>Poland</option><option>Spain</option><option>Italy</option><option>Australia</option><option>Canada</option><option>South Africa</option><option>Lithuania</option><option>North Macedonia</option><option>Other</option>
        </select>
      </div>
      <div class="fg"><label>Business Type</label>
        <select>
          <option>Online Store / E-commerce</option><option>Boutique / Retail Shop</option><option>Wholesaler / Distributor</option><option>Marketplace Seller (Amazon, eBay…)</option><option>Other</option>
        </select>
      </div>
      <div class="fg"><label>Password</label><input type="password" placeholder="Create a password" required></div>
      <div class="auth-check"><input type="checkbox" required><span>I agree to the <a href="#" style="color:var(--red)">Terms & Conditions</a> and confirm this is a business account for wholesale purchasing.</span></div>
      <button type="submit" class="btn-primary auth-submit">Create Wholesale Account →</button>
    </form>
    <div class="auth-switch">Already have an account? <a href="login.html">Login</a></div>
    <a href="index.html" class="auth-back">← Back to Homepage</a>
  </div>
</div>
<script src="i18n.js"></script>
<script src="app.js"></script>
<script>wkfInitLang();</script>
</body></html>
